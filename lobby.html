<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack Griffin — The Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+JP:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#efe6d3;--red:#c8703a;--amber:#E4B04A;--warm:#f0b25a;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#0e0b08;overflow:hidden;font-family:'Syne',sans-serif;}
#app{position:fixed;inset:0;}
#app canvas{display:block;touch-action:none;cursor:grab;}
#app.locked canvas{cursor:none;}
.hdr{position:fixed;z-index:20;color:#efe6d3;}
#logo{top:22px;left:26px;font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer;text-shadow:0 2px 10px #000;}
#logo span{color:var(--red);}
#nav{top:18px;right:20px;display:flex;gap:14px;}
#nav button{background:none;border:0;color:#ede3cc;font-family:'Caveat',cursive;font-weight:700;font-size:20px;letter-spacing:.5px;padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:color .15s,transform .12s;text-shadow:0 1px 6px rgba(0,0,0,.5);}
#nav button:hover{color:var(--warm);transform:translateY(-1px) rotate(-.6deg);}
#nav .nic{width:14px;height:14px;opacity:.9;}
#btnmusic{display:inline-flex;align-items:center;gap:7px;}
#btnmusic .eq{display:inline-flex;align-items:flex-end;gap:2px;height:11px;}
#btnmusic .eq i{width:2px;height:3px;background:currentColor;display:block;border-radius:1px;}
#btnmusic.playing .eq i{animation:eqb .8s ease-in-out infinite;}
#btnmusic.playing .eq i:nth-child(2){animation-delay:.18s;}
#btnmusic.playing .eq i:nth-child(3){animation-delay:.36s;}
@keyframes eqb{0%,100%{height:3px;}50%{height:11px;}}
#musicmenu{position:fixed;z-index:30;display:none;flex-direction:column;min-width:206px;background:rgba(26,18,12,.97);border:1px solid #7a5a34;border-radius:10px;box-shadow:0 20px 46px rgba(0,0,0,.7);overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#musicmenu.open{display:flex;}
#musicmenu .mm-head{font-family:'Syne',sans-serif;font-weight:800;font-size:10px;letter-spacing:3px;color:#9a8360;padding:13px 16px 9px;text-transform:uppercase;}
#musicmenu button{background:none;border:0;color:#d9cdb6;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;padding:9px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:11px;transition:background .15s,color .15s;}
#musicmenu button .mm-ic{font-size:14px;width:18px;text-align:center;opacity:.9;}
#musicmenu button .mm-lbl{flex:1;}
#musicmenu button:hover{background:rgba(200,112,58,.16);color:#fff;}
#musicmenu button.active{color:#fff;}
#musicmenu button.active .mm-lbl{color:#fff;}
#musicmenu .mm-bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px;opacity:0;}
#musicmenu .mm-bars i{width:2px;height:3px;background:var(--amber);display:block;border-radius:1px;}
#musicmenu button.active .mm-bars{opacity:1;}
#musicmenu button.active .mm-bars i{animation:eqb .8s ease-in-out infinite;}
#musicmenu button.active .mm-bars i:nth-child(2){animation-delay:.18s;}
#musicmenu button.active .mm-bars i:nth-child(3){animation-delay:.36s;}
#musicmenu .mm-vol{display:flex;align-items:center;gap:10px;padding:11px 16px 13px;margin-top:4px;border-top:1px solid rgba(181,130,78,.18);font-size:10px;letter-spacing:2px;color:#9a8360;font-weight:700;}
#musicmenu .mm-vol input{flex:1;accent-color:var(--warm);height:3px;cursor:pointer;}
#areaind{bottom:16px;left:26px;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:14px;color:#c9b79a;text-shadow:0 2px 8px #000;transition:color .4s;}
#areaind small{display:block;font-family:'Syne',sans-serif;font-size:10px;letter-spacing:3px;color:#9a8360;margin-top:2px;}
#hint{bottom:16px;right:26px;font-size:11px;letter-spacing:2px;color:#a08d70;text-align:right;text-shadow:0 2px 8px #000;}
#cross{position:fixed;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;border:1.5px solid rgba(240,230,211,.5);z-index:15;pointer-events:none;opacity:0;transition:opacity .3s;}
#app.locked ~ #cross{opacity:1;}
#tip{position:fixed;left:50%;top:52%;transform:translateX(-50%);z-index:16;color:#efe6d3;font-weight:700;letter-spacing:2px;font-size:13px;background:rgba(20,14,9,.7);padding:12px 20px;border:1px solid #7a5a34;border-radius:10px;text-align:center;text-shadow:0 2px 8px #000;transition:opacity .5s;}
#loading{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#0e0b08;color:#c9b79a;font-weight:800;letter-spacing:3px;font-size:14px;transition:opacity .6s;}
#joy{position:fixed;left:24px;bottom:26px;width:118px;height:118px;z-index:30;display:none;touch-action:none;-webkit-user-select:none;user-select:none;}
body.touch #joy{display:block;}
#joy .jr{position:absolute;inset:0;pointer-events:none;overflow:visible;}
#joyknob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(200,112,58,.5);border:2px solid rgba(240,230,211,.75);box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none;}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,5,3,.82);z-index:50;padding:26px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.overlay.open{display:flex;}
.overlay .sheet{background:#171009;border:1px solid rgba(230,180,110,.3);border-radius:16px;box-shadow:0 34px 80px rgba(0,0,0,.72),0 0 44px rgba(230,150,70,.12);max-width:920px;width:100%;max-height:90vh;overflow:hidden;display:flex;}
.overlay .nart{flex:1.25;min-width:0;background:#0d0906;display:flex;align-items:center;justify-content:center;padding:18px;}
.overlay .nart img{max-width:100%;max-height:calc(90vh - 36px);object-fit:contain;display:block;border:1px solid rgba(230,180,110,.14);box-shadow:0 10px 34px rgba(0,0,0,.55);}
.overlay .nart .ph{color:#c9b79a;font-family:'Syne',sans-serif;font-weight:800;letter-spacing:2px;text-align:center;padding:40px;}
.overlay .nbody{flex:1;min-width:0;padding:34px 32px;display:flex;flex-direction:column;justify-content:center;overflow:auto;}
.overlay .nmeta{display:flex;align-items:center;gap:9px;font-family:'Syne',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--amber);margin-bottom:11px;}
.overlay .nmeta .ndot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 9px var(--amber);flex:0 0 auto;}
.overlay .nrule{height:2px;width:54px;background:linear-gradient(90deg,var(--amber),transparent);margin-bottom:16px;}
.overlay .nbody h1{font-family:'Syne',sans-serif;font-weight:800;font-size:30px;line-height:1.07;letter-spacing:-.5px;margin:0 0 15px;color:#f4ead2;}
.overlay .nbody .desc{font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:1.85;color:#c9b79a;}
.overlay .nbody .sig{margin-top:22px;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;letter-spacing:1px;color:#8a7350;}
.overlay .nbody .sig b{color:var(--red);}
@media(max-width:680px){.overlay{padding:14px;}.overlay .sheet{flex-direction:column;max-height:92vh;}.overlay .nart{padding:12px;max-height:50vh;}.overlay .nart img{max-height:46vh;}.overlay .nbody{padding:22px;}.overlay .nbody h1{font-size:25px;}}
.ovclose{position:fixed;top:20px;right:22px;z-index:52;width:46px;height:46px;border-radius:50%;border:2px solid #efe6d3;background:rgba(20,14,9,.55);color:#efe6d3;font-size:18px;cursor:pointer;display:none;transition:background .15s,transform .18s;}
.ovclose:hover{background:var(--red);border-color:var(--red);transform:rotate(90deg);}
#info.open .ovclose,#settings.open .ovclose{display:block;}
#btnedit{border:1px solid #6a4a2f;border-radius:8px;padding:7px 12px !important;font-size:16px !important;}
#btnedit.on{background:var(--red);color:#fff;border-color:var(--red);}
#editbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:40;width:min(760px,96vw);background:rgba(20,14,9,.94);border:1px solid #7a5a34;border-bottom:none;border-radius:14px 14px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.6);padding:12px 16px 14px;display:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
#editbar.open{display:block;}
#editbar .eb-title{font-family:'Syne',sans-serif;font-size:11px;letter-spacing:2px;color:#c9b79a;text-transform:uppercase;font-weight:800;margin-bottom:10px;}
#editbar .eb-title span{color:#8a7350;letter-spacing:1px;font-weight:700;text-transform:none;}
#editbar .eb-items{display:flex;gap:8px;flex-wrap:wrap;}
#editbar .eb-items button{background:rgba(45,32,20,.7);border:1px solid #6a4a2f;color:#ede3cc;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.4px;padding:9px 13px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .14s,border-color .14s,transform .1s;}
#editbar .eb-items button:hover{background:rgba(200,112,58,.25);border-color:var(--red);transform:translateY(-1px);}
#editbar .eb-items button .ei{font-size:15px;}
#editbar .eb-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
#editbar .eb-foot button{background:none;border:1px solid #6a4a2f;color:#c9b79a;font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;padding:7px 14px;border-radius:8px;cursor:pointer;text-transform:uppercase;}
#editbar .eb-foot button:hover{border-color:#c9b79a;color:#fff;}
#editbar .eb-foot button.prim{background:var(--red);border-color:var(--red);color:#fff;}
#editctl{position:fixed;z-index:41;display:none;gap:6px;background:rgba(20,14,9,.95);border:1px solid #7a5a34;border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.6);}
#editctl.open{display:flex;}
#editctl button{width:36px;height:36px;border-radius:7px;border:1px solid #6a4a2f;background:rgba(45,32,20,.7);color:#ede3cc;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#editctl button:hover{background:rgba(200,112,58,.3);border-color:var(--red);}
#editctl button.del:hover{background:#a3352d;border-color:#a3352d;}
#btnset{border:1px solid #6a4a2f;border-radius:8px;padding:7px 11px !important;font-size:16px !important;line-height:1;}
#btnset.on{background:var(--red);color:#fff;border-color:var(--red);}
.setsheet{position:relative;background:#181009;border:none;border-radius:4px;box-shadow:0 34px 80px rgba(0,0,0,.72),0 0 44px rgba(230,150,70,.12);max-width:460px;width:100%;max-height:88vh;overflow-y:auto;overflow-x:hidden;padding:20px 30px 24px;font-family:'Caveat',cursive;scrollbar-width:thin;scrollbar-color:#6a4a2f transparent;}
.setsheet::-webkit-scrollbar{width:10px;}
.setsheet::-webkit-scrollbar-track{background:transparent;margin:8px 0;}
.setsheet::-webkit-scrollbar-thumb{background:#6a4a2f;border-radius:20px;border:3px solid #181009;}
.setsheet::-webkit-scrollbar-thumb:hover{background:var(--red);}
#setframe{position:fixed;pointer-events:none;z-index:51;overflow:visible;}
.setsheet h2{font-size:38px;font-weight:700;color:#f4ead2;margin:0 0 2px;line-height:1;}
.setsheet .subh{font-size:20px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);font-weight:700;margin:18px 0 4px;}
.setsheet .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0;color:#e7dcc4;font-size:21px;font-weight:700;}
.setsheet .row .rl{flex:1;line-height:1.1;}
.setsheet input[type=range]{flex:1.3;accent-color:var(--red);height:4px;cursor:pointer;}
.setsheet .val{min-width:46px;text-align:right;color:#c9b79a;font-size:18px;font-variant-numeric:tabular-nums;}
.setsheet .kb{position:relative;min-width:70px;text-align:center;background:none;border:none;color:#ede3cc;font-family:'Caveat',cursive;font-weight:700;font-size:20px;letter-spacing:.5px;padding:4px 14px;cursor:pointer;text-transform:uppercase;}
.setsheet .kb .sk{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
.setsheet .kb .sk path{stroke:#cdb994;transition:stroke .14s;}
.setsheet .kb:hover{color:var(--warm);}
.setsheet .kb:hover .sk path{stroke:var(--warm);}
.setsheet .kb.capturing{color:#fff;}
.setsheet .kb.capturing .sk path{stroke:var(--red);}
.setsheet .tg{width:50px;height:26px;border-radius:14px;border:2px solid #6a4a2f;background:rgba(45,32,20,.85);position:relative;cursor:pointer;flex:0 0 auto;transition:background .16s;}
.setsheet .tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#c9b794;transition:left .16s,background .16s;}
.setsheet .tg.on{background:var(--red);border-color:var(--red);}
.setsheet .tg.on::after{left:26px;background:#fff;}
.setsheet .setfoot{margin-top:20px;display:flex;justify-content:flex-end;}
.setsheet .setfoot button{position:relative;background:none;border:none;color:#d9cdb6;font-family:'Caveat',cursive;font-weight:700;font-size:20px;letter-spacing:.5px;padding:6px 20px;cursor:pointer;text-transform:uppercase;}
.setsheet .setfoot button .sk{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
.setsheet .setfoot button .sk path{stroke:#cdb994;transition:stroke .14s;}
.setsheet .setfoot button:hover{color:var(--warm);}
.setsheet .setfoot button:hover .sk path{stroke:var(--warm);}
#setclose{border:none !important;background:none !important;color:transparent;}
#setclose:hover{transform:scale(1.1) rotate(-4deg);}
#setclose .sk{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
#setclose .sk path{stroke:#cdb994;transition:stroke .14s;}
#setclose:hover .sk path{stroke:var(--red);}
@media(max-width:520px){.overlay{padding:14px;}.overlay .sheet{max-width:100%;}.overlay .nart{height:clamp(200px,38vh,340px);}.overlay .nbody{padding:0 20px 22px;}.overlay .nbody h1{font-size:26px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="cross"></div>
<div id="loading">ENTERING THE SPACE…</div>
<div class="hdr" id="logo" role="button" tabindex="0">JACK<span>.</span></div>
<div class="hdr" id="nav">
  <button id="btnset" title="settings">⚙</button>
  <button id="btnedit" title="arrange the furniture">✎ Edit</button>
  <button id="btnmusic" aria-label="toggle background music" aria-pressed="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>Music</button>
  <button id="btnhome" title="back to the home page"><svg class="nic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg>Home</button>
</div>
<div id="musicmenu"></div>
<div class="hdr" id="areaind"></div>
<div class="hdr" id="hint">W A S D MOVE · Q E TURN · R F LOOK UP/DOWN · SHIFT RUN</div>
<div id="tip"><b>W A S D</b> to move · <b>Q</b> / <b>E</b> to turn · <span style="opacity:.7">click a piece to view it</span></div>

<div id="joy" aria-hidden="true"><div id="joyknob"></div></div>

<div class="overlay" id="info" role="dialog" aria-modal="true">
  <button class="ovclose" id="infoclose" aria-label="close">✕</button>
  <div class="sheet" id="infosheet"></div>
</div>

<div class="overlay" id="settings" role="dialog" aria-modal="true">
  <button class="ovclose" id="setclose" aria-label="close">✕</button>
  <div class="setsheet" id="setsheet"></div>
</div>

<div id="editbar">
  <div class="eb-title">Add furniture <span>· click one, then drag it into place</span></div>
  <div class="eb-items" id="ebitems"></div>
  <div class="eb-foot">
    <button id="ebcopy" title="copy the layout so it can be made permanent">Copy layout</button>
    <button id="ebclear" title="remove everything you've added">Clear</button>
    <button id="ebdone" class="prim">Done</button>
  </div>
</div>
<div id="editctl">
  <button id="ecrotL" title="rotate left">⟲</button>
  <button id="ecrotR" title="rotate right">⟳</button>
  <button id="ecdup" title="duplicate">⧉</button>
  <button id="ecdel" class="del" title="delete">🗑</button>
</div>

<script src="three.min.js"></script>
<script src="works-school.js"></script>
<script src="works-personal.js"></script>
<script src="works-sketchbook.js"></script>
<script src="works-projects.js"></script>
<script src="works.js"></script>
<script src="models/sofa.js"></script>
<script src="models/furniture.js"></script>
<script src="rough.js"></script>
<script>
(function(){
"use strict";
var loadingEl=document.getElementById('loading');
if(typeof THREE==='undefined'){ loadingEl.textContent='Could not load 3D engine (three.min.js).'; return; }
var WK=(typeof WORKS!=='undefined'&&WORKS.length)?WORKS:[{title:'Untitled'}];
/* make sure each corridor's works list exists even if a file is missing */
['WORKS_SCHOOL','WORKS_PERSONAL','WORKS_SKETCHBOOK','WORKS_PROJECTS'].forEach(function(n){ if(typeof window[n]==='undefined') window[n]=[]; });

/* ==============================================================
   ✏️  EDIT YOUR TEXT HERE  —  change the words inside the quotes.
     name  = big sign over each archway
     sub   = the little line under it
     works = which file's pieces show in that corridor
             (each is its own file — edit those to add/organise art)
   ============================================================== */
var LOBBY_TEXT = {
  welcome:  'welcome',                 // big sign over the reception desk
  subtitle: 'JACK GRIFFIN · GALLERY',  // small line under the welcome sign
  corridors: {
    north: { name: 'PERSONAL',     sub: '個人', works: WORKS_PERSONAL },    // works-personal.js
    east:  { name: 'SCHOOL WORKS', sub: '習作', works: WORKS_SCHOOL },      // works-school.js
    south: { name: 'SKETCHBOOK',   sub: '素描', works: WORKS_SKETCHBOOK },  // works-sketchbook.js
    west:  { name: 'PROJECTS',     sub: '制作', works: WORKS_PROJECTS }     // works-projects.js
  }
};
/* ===================== (end of editable text) ===================== */

/* ================= renderer / scene / camera ================= */
var app=document.getElementById('app');
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth, window.innerHeight);
if('outputColorSpace' in renderer) renderer.outputColorSpace=THREE.SRGBColorSpace;
if('ACESFilmicToneMapping' in THREE){ renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.8; }
app.appendChild(renderer.domElement);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0e0b08);
scene.fog=new THREE.FogExp2(0x0f0d12, 0.011);

var camera=new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.05, 400);
var eyeH=1.7;
camera.position.set(0, eyeH, 6);

/* ================= dimensions ================= */
var LB=9;        // lobby half-size
var CH=5.6;      // lobby ceiling height
var WT=0.3;      // wall thickness
var AW=4;        // archway opening width
var ARCH_H=3.3;  // archway opening height
var CW=4;        // corridor width
var CHc=4.0;     // corridor ceiling height
var CL=30;       // corridor length

/* ================= helpers ================= */
function stdMat(c,r,m){ return new THREE.MeshStandardMaterial({color:c, roughness:(r==null?0.9:r), metalness:(m==null?0:m)}); }
var _BG=THREE.BoxGeometry;
function rbox(w,h,d,rr,seg){ var r=(rr==null?Math.min(w,h,d)*0.22:Math.min(rr,Math.min(w,h,d)/2)); seg=seg||3;
  var g=new _BG(w,h,d,seg,seg,seg), p=g.attributes.position, hw=w/2-r, hh=h/2-r, hd=d/2-r;
  for(var i=0;i<p.count;i++){ var x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    var cx=Math.max(-hw,Math.min(hw,x)),cy=Math.max(-hh,Math.min(hh,y)),cz=Math.max(-hd,Math.min(hd,z));
    var dx=x-cx,dy=y-cy,dz=z-cz,l=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(l>1e-6){ var s=r/l; p.setXYZ(i,cx+dx*s,cy+dy*s,cz+dz*s); } }
  p.needsUpdate=true; g.computeVertexNormals(); return g; }
function box(w,h,d,mat,x,y,z){ var m=new THREE.Mesh(rbox(w,h,d),mat); m.position.set(x||0,y||0,z||0); scene.add(m); return m; }

function radialTex(){ var c=document.createElement('canvas'); c.width=c.height=256; var x=c.getContext('2d');
  var g=x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.28,'rgba(255,255,255,0.66)'); g.addColorStop(0.55,'rgba(255,255,255,0.30)'); g.addColorStop(0.8,'rgba(255,255,255,0.08)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,256,256);
  var t=new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter; t.generateMipmaps=false; if('colorSpace' in t) t.colorSpace=THREE.SRGBColorSpace; return t; }
var glowTex=radialTex();
function glow(x,y,z,ry,scale,color,op){ var m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),

function placeholderTex(w){ var c=document.createElement('canvas'); c.width=384;c.height=512; var x=c.getContext('2d');
  x.fillStyle='#efe6d3'; x.fillRect(0,0,384,512); x.fillStyle='#8a3a25'; x.fillRect(24,24,336,464);
  x.fillStyle='#efe6d3'; x.font='bold 26px Syne, sans-serif'; x.textAlign='center';
  x.fillText((w.title||'').toUpperCase().slice(0,16), 192, 270);
  var t=new THREE.CanvasTexture(c); if('colorSpace' in t) t.colorSpace=THREE.SRGBColorSpace; return t; }
function loadArt(w, cb){
  if(!w||!w.image){ cb(placeholderTex(w||{}), 0.75); return; }
  var img=new Image();
  img.onload=function(){ var c=document.createElement('canvas'); var maxd=800, s=Math.min(1, maxd/Math.max(img.width,img.height));
    c.width=Math.max(2,Math.round(img.width*s)); c.height=Math.max(2,Math.round(img.height*s));
    try{ c.getContext('2d').drawImage(img,0,0,c.width,c.height); }catch(e){ cb(placeholderTex(w),0.75); return; }
    var t=new THREE.CanvasTexture(c); if('colorSpace' in t) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; cb(t, img.width/img.height); };
  img.onerror=function(){ cb(placeholderTex(w),0.75); };
  img.src=w.image;
}
/* text drawn to a canvas → emissive sign board (sketchy handwritten look) */
function signTex(txt, sub){ var c=document.createElement('canvas'); c.width=512;c.height=256; var x=c.getContext('2d');
  x.clearRect(0,0,512,256); x.fillStyle='#f0e4cc'; x.textAlign='center'; x.textBaseline='middle';
  var fs=92; x.font='700 '+fs+'px Caveat, cursive'; var tw=x.measureText(txt).width;
  if(tw>470){ fs=Math.floor(fs*470/tw); x.font='700 '+fs+'px Caveat, cursive'; }
  x.fillText(txt, 256, 120);
  if(sub){ x.font='700 26px Syne, sans-serif'; x.fillStyle='#c79a5a'; x.fillText(sub, 256, 200); }
  var t=new THREE.CanvasTexture(c); if('colorSpace'in t)t.colorSpace=THREE.SRGBColorSpace; return t; }

  return new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:t, transparent:true})); }

function frameArt(x,z,yaw,w,tint){
  if(!w) return;
  var g=new THREE.Group(); g.position.set(x,1.95,z); g.rotation.y=yaw; scene.add(g);
  var fr=new THREE.Mesh(rbox(1.7,2.2,0.1),woodDark); g.add(fr);
  var mat=new THREE.MeshStandardMaterial({color:0x000000,emissive:0xffffff,emissiveIntensity:1.5,roughness:1});
  var art=new THREE.Mesh(new THREE.PlaneGeometry(1.5,2.0),mat); art.position.z=0.06; art.userData.art=true; g.add(art);
  art.userData.work=w; pickable.push(art);
  loadArt(w,function(tex,aspect){ var pa=1.5/2.0;
    if(aspect>pa){ tex.repeat.x=pa/aspect; tex.offset.x=(1-tex.repeat.x)/2; } else { tex.repeat.y=aspect/pa; tex.offset.y=(1-tex.repeat.y)/2; }
    mat.map=tex; mat.emissiveMap=tex; mat.needsUpdate=true; });
  glow(x,2.0,z,yaw,3.4,tint,0.6);
}

function buildCorridor(key){
  var m=MOODS[key];
  var wallM=new THREE.MeshStandardMaterial({color:m.wall,roughness:1,side:THREE.DoubleSide});
  var floorM=stdMat(m.floor, key==='west'?0.35:0.85, key==='west'?0.3:0);
  var ceilM=stdMat((m.wall&0xfefefe)>>1,1);
  // orientation: vertical = along Z (north/south), horizontal = along X (east/west)
  var vert=(key==='north'||key==='south');
  var sgn=(key==='north'||key==='west')?-1:1;
  var c0=LB, c1=LB+CL, mid=(c0+c1)/2;
  var cx = vert?0: sgn*mid, cz = vert? sgn*mid : 0;
  var xs = vert?CW:CL, zs = vert?CL:CW;
  // floor + ceiling
  var fl=new THREE.Mesh(new THREE.PlaneGeometry(xs,zs),floorM); fl.rotation.x=-Math.PI/2; fl.position.set(cx,0,cz); scene.add(fl);
  var ce=new THREE.Mesh(new THREE.PlaneGeometry(xs,zs),ceilM); ce.rotation.x=Math.PI/2; ce.position.set(cx,CHc,cz); scene.add(ce);
  // side walls + end cap
  if(vert){
    [-1,1].forEach(function(s){ var w=new THREE.Mesh(new THREE.PlaneGeometry(CL,CHc),wallM); w.rotation.y=(s<0?1:-1)*Math.PI/2; w.position.set(s*CW/2,CHc/2,cz); scene.add(w); });
    var end=new THREE.Mesh(new THREE.PlaneGeometry(CW,CHc),wallM); end.position.set(0,CHc/2,sgn*c1); if(sgn>0)end.rotation.y=Math.PI; scene.add(end);
  } else {
    [-1,1].forEach(function(s){ var w=new THREE.Mesh(new THREE.PlaneGeometry(CL,CHc),wallM); w.rotation.y=(s<0?0:Math.PI); w.position.set(cx,CHc/2,s*CW/2); scene.add(w); });
    var end=new THREE.Mesh(new THREE.PlaneGeometry(CW,CHc),wallM); end.rotation.y=(sgn<0?Math.PI/2:-Math.PI/2); end.position.set(sgn*c1,CHc/2,0); scene.add(end);
  }
  // mood lights down the corridor (3 real lights + cheap glow pools)
  [0.18,0.5,0.82].forEach(function(f){ var d=c0+CL*f, lx=vert?0:sgn*d, lz=vert?sgn*d:0;
    var pl=new THREE.PointLight(m.light,m.li,20,1.7); pl.position.set(lx,CHc-0.55,lz); scene.add(pl); });
  for(var d2=c0+3; d2<c1; d2+=4.4){ var gx=vert?0:sgn*d2, gz=vert?sgn*d2:0;
    glow(gx,CHc-0.3,gz,0,2.4,m.glowc,0.55); glowFloor(gx,gz,3.2,m.glowc,0.16); }
  // framed art from this corridor's own works file — spread evenly, alternating walls
  var works=m.works||[], nw=works.length;
  works.forEach(function(w,idx){ var t=(nw>1?idx/(nw-1):0.5), d=c0+5+t*(CL-10), lat=(idx%2===0?-1:1)*(CW/2-0.12);
    if(vert){ frameArt(lat,sgn*d, (lat<0?Math.PI/2:-Math.PI/2), w, m.glowc); }
    else { frameArt(sgn*d,lat, (lat<0?0:Math.PI), w, m.glowc); } });
  // archway mood sign above the lobby-side opening (inside the lobby, over the arch)
  var sgnX=vert?0:sgn*(LB-0.15), sgnZ=vert?sgn*(LB-0.15):0, sgnYaw=vert?(sgn<0?0:Math.PI):(sgn<0?Math.PI/2:-Math.PI/2);
  var s=signBoard(m.label, m.jp, 3.2, 1.1); s.position.set(sgnX, ARCH_H+0.55, sgnZ); s.rotation.y=sgnYaw; scene.add(s);
  // end-of-corridor accent glow
  var ex=vert?0:sgn*(c1-0.5), ez=vert?sgn*(c1-0.5):0;
  glow(ex,2.0,ez,sgnYaw,4,m.accent,0.55);
  var eL=new THREE.PointLight(m.accent, key==='east'?3.5:2.6, 12,2); eL.position.set(vert?0:sgn*(c1-2), 2.2, vert?sgn*(c1-2):0); scene.add(eL);

  if(m.effect==='rain') makeRain(cx,cz);
  if(m.effect==='stars') makeStars(cx,cz,sgn,vert,c1);
}

var clock=(THREE.Clock?new THREE.Clock():null), tprev=0;

  var dt=clock?Math.min(clock.getDelta(),0.05):0.016;
  if(!uiOpen && !setOpen){   // freeze walking/turning while a panel is open
    var turn=SET.turnSpeed*dt;
    if(down('turnL')) yaw+=turn;
    if(down('turnR')) yaw-=turn;
    if(down('up'))   pit=Math.min(1.05,pit+turn*0.7);   // look up
    if(down('down')) pit=Math.max(-1.05,pit-turn*0.7);  // look down
    var sp=(down('run')?SET.runSpeed:SET.moveSpeed)*dt, fx=-Math.sin(yaw), fz=-Math.cos(yaw), rx=Math.cos(yaw), rz=-Math.sin(yaw), mx=0,mz=0;
    if(down('fwd')  ||keys['arrowup'])   { mx+=fx; mz+=fz; }
    if(down('back') ||keys['arrowdown']) { mx-=fx; mz-=fz; }
    if(down('right')||keys['arrowright']){ mx+=rx; mz+=rz; }
    if(down('left') ||keys['arrowleft']) { mx-=rx; mz-=rz; }
    if(joyId!==null && (Math.abs(joyVec.x)>0.12||Math.abs(joyVec.y)>0.12)){ mx += fx*(-joyVec.y)+rx*joyVec.x; mz += fz*(-joyVec.y)+rz*joyVec.x; }

      if(inBounds(nx,camera.position.z)) camera.position.x=nx;
      if(inBounds(camera.position.x,nz)) camera.position.z=nz; }
    camera.position.y=eyeH;
    camera.rotation.set(pit,yaw,0,'YXZ');
  }

  if(carousel){ carousel.visible=SET.carousel; if(SET.carousel) carousel.rotation.y+=dt*0.16; }
  if(chand) chand.intensity=22*(0.92+0.08*Math.sin(T*1.1));

  updateArea();
  if(editMode && selFurn) positionCtl();
  renderer.render(scene,camera);
}

    bossa:{label:'Bossa',wave:'triangle',chords:[[130.81,196,261.63,329.63],[146.83,220,261.63,349.23],[110,164.81,220,329.63],[196,246.94,293.66,349.23]],interval:6000,dur:6.2,lp:[820,1750,920],amb:'none',vol:0.5,cg:0.09,pluck:{rate:0.7,vol:0.12,oct:0.4,swing:0.16},bass:{rate:1.5,vol:0.16}},

  };
  var AC=null,master=null,on=false,sched=null,amb=[],idx=0,cur=null,userVol=0.55;
  function ensure(){ if(AC)return true; var C=window.AudioContext||window.webkitAudioContext; if(!C)return false; try{AC=new C();}catch(e){return false;} master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
    try{ if(AC.state==='suspended'&&AC.resume) AC.resume(); var bb=AC.createBuffer(1,1,22050), bs=AC.createBufferSource(); bs.buffer=bb; bs.connect(AC.destination); bs.start(0); }catch(e){}  // iOS unlock
    return true; }
  function fade(v){ var t=AC.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t); master.gain.linearRampToValueAtTime(v,t+(v>0?2.2:1.6)); }
  function pluck(freq,t,vol,wave){ var o=AC.createOscillator(); o.type=wave||'triangle'; o.frequency.value=freq; var g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55); var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t+0.6); }
  function chord(cfg,freqs){ var t=AC.currentTime, dur=cfg.dur;
    var cgn=AC.createGain(); cgn.gain.setValueAtTime(0.0001,t); cgn.gain.linearRampToValueAtTime(cfg.cg,t+dur*0.22); cgn.gain.linearRampToValueAtTime(cfg.cg*0.8,t+dur*0.78); cgn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=0.6; lp.frequency.setValueAtTime(cfg.lp[0],t); lp.frequency.linearRampToValueAtTime(cfg.lp[1],t+dur*0.5); lp.frequency.linearRampToValueAtTime(cfg.lp[2],t+dur);
    cgn.connect(lp); lp.connect(master);
    freqs.forEach(function(f,i){ (i===0?[0]:[7,-7]).forEach(function(det){ var o=AC.createOscillator(); o.type=(i===0?'sine':cfg.wave); o.frequency.value=f; o.detune.value=det; var g=AC.createGain(); g.gain.value=(i===0?0.8:0.4); o.connect(g); g.connect(cgn); o.start(t); o.stop(t+dur+0.3); }); });
    if(cfg.pluck){ var pk=cfg.pluck, tones=freqs.slice(1), n=Math.floor(dur/pk.rate), sw=pk.swing||0;
      for(var s=0;s<n;s++){ var tt=t+s*pk.rate+(s%2?pk.rate*sw:0)+Math.random()*0.015; var note=tones[(s+(Math.random()<0.4?1:0))%tones.length]*(Math.random()<(pk.oct||0)?2:1); pluck(note,tt,pk.vol,cfg.wave); } }
    if(cfg.bass){ var bp=cfg.bass, bn=Math.floor(dur/bp.rate); for(var bi=0;bi<bn;bi++){ pluck(bi%2?freqs[0]*1.5:freqs[0], t+bi*bp.rate, bp.vol, 'sine'); } } }
  function tick(){ if(!on||!AC||!cur)return; chord(cur,cur.chords[idx%cur.chords.length]); idx++; }
  function crackle(){ var len=Math.floor(AC.sampleRate*6), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0), count=Math.floor(len/AC.sampleRate*7);
    for(var k=0;k<count;k++){ var pos=(Math.random()*len)|0, amp=Math.random()*0.5+0.12, dec=(Math.random()*55+15)|0; for(var j=0;j<dec&&pos+j<len;j++){ d[pos+j]+=(Math.random()*2-1)*amp*Math.pow(1-j/dec,3); } }
    var s=AC.createBufferSource(); s.buffer=b; s.loop=true; var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3600; var g=AC.createGain(); g.gain.value=0.09; s.connect(lp); lp.connect(g); g.connect(master); s.start(); return {stop:function(){try{s.stop();}catch(e){}}}; }
  function rain(){ var len=Math.floor(AC.sampleRate*4), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0), i; for(i=0;i<len;i++){ d[i]=(Math.random()*2-1); }
    var s=AC.createBufferSource(); s.buffer=b; s.loop=true; var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1150; lp.Q.value=0.4; var g=AC.createGain(); g.gain.value=0.06;
    var lfo=AC.createOscillator(); lfo.frequency.value=0.12; var lg=AC.createGain(); lg.gain.value=0.02; lfo.connect(lg); lg.connect(g.gain); lfo.start();
    s.connect(lp); lp.connect(g); g.connect(master); s.start(); return {stop:function(){try{s.stop();}catch(e){} try{lfo.stop();}catch(e){}}}; }
  function startAmb(type){ if(type==='crackle') amb.push(crackle()); else if(type==='rain') amb.push(rain()); }
  function stopAmb(){ amb.forEach(function(o){o.stop();}); amb=[]; }
  function play(key){ var cfg=MOODS[key]; if(!cfg||!ensure())return; if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
    cur=cfg; on=true; idx=0; if(sched)clearInterval(sched); stopAmb(); tick(); sched=setInterval(tick,cfg.interval); startAmb(cfg.amb); fade(cfg.vol*userVol);
    btn.classList.add('playing'); btn.setAttribute('aria-pressed','true'); mark(key); try{localStorage.setItem('bgm',key);}catch(e){} }
  function stopAll(){ on=false; cur=null; if(sched){clearInterval(sched);sched=null;} if(AC)fade(0); var old=amb; amb=[]; setTimeout(function(){ old.forEach(function(o){o.stop();}); },2000);
    btn.classList.remove('playing'); btn.setAttribute('aria-pressed','false'); mark('off'); try{localStorage.setItem('bgm','off');}catch(e){} }
  function mark(key){ var a=key||'off'; var bs=menu.querySelectorAll('button'); for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('active', bs[i].getAttribute('data-mood')===a); } }
  var IC={lofi:'🎧',jazz:'☕',dreamy:'✨',rainy:'🌧️',night:'🌙',bossa:'🌴',focus:'◎'};
  var html='<div class="mm-head">Music</div>';
  Object.keys(MOODS).forEach(function(k){ html+='<button data-mood="'+k+'"><span class="mm-ic">'+(IC[k]||'♪')+'</span><span class="mm-lbl">'+MOODS[k].label+'</span><span class="mm-bars" aria-hidden="true"><i></i><i></i><i></i></span></button>'; });
  html+='<button data-mood="off"><span class="mm-ic">⏻</span><span class="mm-lbl">Off</span></button>';
  html+='<div class="mm-vol"><span>VOL</span><input type="range" id="mmvol" min="0" max="100" value="55" aria-label="music volume"></div>';
  menu.innerHTML=html;
  Array.prototype.forEach.call(menu.querySelectorAll('button'),function(bb){ bb.addEventListener('click',function(ev){ ev.stopPropagation(); var k=bb.getAttribute('data-mood'); if(k==='off') stopAll(); else play(k); menu.classList.remove('open'); }); });
  var volEl=document.getElementById('mmvol');
  try{ var sv=localStorage.getItem('bgmvol'); if(sv!=null){ userVol=(+sv)/100; volEl.value=sv; } }catch(e){}
  volEl.addEventListener('click',function(ev){ ev.stopPropagation(); });
  volEl.addEventListener('input',function(){ userVol=(+volEl.value)/100; try{localStorage.setItem('bgmvol',volEl.value);}catch(e){} if(on&&AC&&cur){ var t=AC.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t); master.gain.linearRampToValueAtTime(cur.vol*userVol,t+0.15); } });
  btn.addEventListener('click',function(e){ e.stopPropagation(); if(menu.classList.contains('open')){ menu.classList.remove('open'); return; }
    var r=btn.getBoundingClientRect(); menu.classList.add('open');
    var mw=menu.offsetWidth||210, L=Math.max(8, Math.min(r.left, window.innerWidth-mw-8));
    menu.style.left=L+'px'; menu.style.top=(r.bottom+6)+'px'; menu.style.right='auto'; });
  document.addEventListener('click',function(e){ if(!menu.contains(e.target)&&!btn.contains(e.target)) menu.classList.remove('open'); });
  var want=null; try{ want=localStorage.getItem('bgm'); }catch(e){}
  mark(want&&MOODS[want]?want:'off');
  if(want&&want!=='off'&&MOODS[want]){ var first=function(){ play(want); window.removeEventListener('pointerdown',first,true); window.removeEventListener('keydown',first,true); }; window.addEventListener('pointerdown',first,true); window.addEventListener('keydown',first,true); }
})();
})();
