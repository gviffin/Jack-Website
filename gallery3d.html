<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack Griffin — Gallery (3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+JP:wght@400;700;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#efe6d3;--red:#c8703a;--amber:#E4B04A;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#0e0b08;overflow:hidden;font-family:'Syne',sans-serif;}
#app{position:fixed;inset:0;}
#app canvas{display:block;touch-action:none;}
.hdr{position:fixed;z-index:20;color:#efe6d3;}
#logo{top:22px;left:26px;font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer;text-shadow:0 2px 10px #000;}
#logo span{color:var(--red);}
#nav{top:18px;right:20px;display:flex;gap:14px;}
#nav button{position:relative;background:none;border:0;color:#ede3cc;font-family:'Caveat',cursive;font-weight:700;font-size:20px;letter-spacing:.5px;padding:9px 18px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:color .15s,transform .12s;text-shadow:0 1px 6px rgba(0,0,0,.5);}
#nav button .sketch{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
#nav button .sketch path{stroke:#cdb994;}
#nav button:hover{color:var(--warm);transform:translateY(-1px) rotate(-.6deg);}
#nav button:hover .sketch path{stroke:var(--warm);}
#nav .nic{width:14px;height:14px;opacity:.9;flex:0 0 auto;}
#btnmusic{display:inline-flex;align-items:center;gap:7px;}
#btnmusic .eq{display:inline-flex;align-items:flex-end;gap:2px;height:11px;}
#btnmusic .eq i{width:2px;height:3px;background:currentColor;display:block;border-radius:1px;}
#btnmusic.playing .eq i{animation:eqb .8s ease-in-out infinite;}
#btnmusic.playing .eq i:nth-child(2){animation-delay:.18s;}
#btnmusic.playing .eq i:nth-child(3){animation-delay:.36s;}
@keyframes eqb{0%,100%{height:3px;}50%{height:11px;}}
#musicmenu{position:fixed;z-index:30;display:none;flex-direction:column;min-width:206px;background:rgba(26,18,12,.97);border:1px solid #7a5a34;border-radius:10px;box-shadow:0 20px 46px rgba(0,0,0,.7);overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#musicmenu.open{display:flex;}
#musicmenu .mm-head{font-family:'Syne',sans-serif;font-weight:800;font-size:10px;letter-spacing:3px;color:#9a8360;padding:13px 16px 9px;text-transform:uppercase;}
#musicmenu button{background:none;border:0;color:#d9cdb6;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;padding:9px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:11px;transition:background .15s,color .15s;}
#musicmenu button .mm-ic{font-size:14px;width:18px;text-align:center;opacity:.9;}
#musicmenu button .mm-lbl{flex:1;}
#musicmenu button:hover{background:rgba(200,112,58,.16);color:#fff;}
#musicmenu button.active{color:#fff;}
#musicmenu button.active .mm-lbl{color:#fff;}
#musicmenu .mm-bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px;opacity:0;}
#musicmenu .mm-bars i{width:2px;height:3px;background:var(--amber);display:block;border-radius:1px;}
#musicmenu button.active .mm-bars{opacity:1;}
#musicmenu button.active .mm-bars i{animation:eqb .8s ease-in-out infinite;}
#musicmenu button.active .mm-bars i:nth-child(2){animation-delay:.18s;}
#musicmenu button.active .mm-bars i:nth-child(3){animation-delay:.36s;}
#musicmenu .mm-vol{display:flex;align-items:center;gap:10px;padding:11px 16px 13px;margin-top:4px;border-top:1px solid rgba(181,130,78,.18);font-size:10px;letter-spacing:2px;color:#9a8360;font-weight:700;}
#musicmenu .mm-vol input{flex:1;accent-color:var(--warm);height:3px;cursor:pointer;}
#chapind{bottom:16px;left:26px;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:13px;color:#c9b79a;text-shadow:0 2px 8px #000;}
#hint{bottom:16px;right:26px;font-size:11px;letter-spacing:2px;color:#a08d70;text-align:right;text-shadow:0 2px 8px #000;}
#loading{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#0e0b08;color:#c9b79a;font-weight:800;letter-spacing:3px;font-size:14px;transition:opacity .6s;}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,5,3,.8);z-index:50;padding:20px;}
.overlay.open{display:flex;}
.sheet{background:#efe6d3;border:8px solid #6b4a2f;box-shadow:0 30px 80px rgba(0,0,0,.7);max-width:940px;width:100%;max-height:92vh;overflow:auto;display:flex;}
.sheet .artbox{flex:1.2;min-width:0;background:#2a2119;display:flex;align-items:center;justify-content:center;padding:0;}
.sheet .artbox img{width:100%;height:100%;object-fit:cover;display:block;}
.sheet .artbox svg{width:100%;display:block;}
.sheet .info{flex:1;padding:30px 32px;min-width:0;}
.chapno{font-family:'Noto Sans JP',sans-serif;font-weight:900;font-size:16px;color:var(--red);}
.sheet h1{font-weight:800;font-size:30px;margin:8px 0 6px;color:#2a2119;line-height:1.1;}
.meta{font-size:12px;letter-spacing:2px;color:#7a6a52;margin-bottom:16px;}
.desc{font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:1.8;color:#3a2f22;}
.btnrow{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}
.btnrow button{background:#efe6d3;border:3px solid #6b4a2f;color:#3a2f22;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;padding:10px 16px;cursor:pointer;}
.btnrow button:hover:not(:disabled){background:var(--red);border-color:var(--red);color:#fff;}
.btnrow button:disabled{opacity:.3;cursor:default;}
@media (max-width:760px){.sheet{flex-direction:column;}.sheet .artbox{border-bottom:6px solid #6b4a2f;}#hint{display:none;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">ENTERING THE GALLERY…</div>
<div class="hdr" id="logo" role="button" tabindex="0">JACK<span>.</span></div>
<div class="hdr" id="nav">
  <button id="btnmusic" aria-label="toggle background music" aria-pressed="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>Lofi</button>
  <button id="btnabout"><svg class="nic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.8" r="0.9" fill="currentColor" stroke="none"/></svg>About</button>
  <button id="btn2d" title="back to the home page"><svg class="nic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></svg>Home</button>
</div>
<div id="musicmenu"></div>
<div class="hdr" id="chapind"></div>
<div class="hdr" id="hint">SCROLL / DRAG TO WALK · MOVE MOUSE TO LOOK · CLICK A PIECE</div>

<div class="overlay" id="chap" role="dialog" aria-modal="true"><div class="sheet" id="chapsheet"></div></div>
<div class="overlay" id="about" role="dialog" aria-modal="true"><div class="sheet" id="aboutsheet"></div></div>

<script src="three.min.js"></script>
<script src="works.js"></script>
<script src="models/bookshelf.js"></script>
<script src="models/sofa.js"></script>
<script src="models/furniture.js"></script>
<script>
(function(){
"use strict";
if(typeof THREE==='undefined'){ document.getElementById('loading').textContent='Could not load 3D engine (three.min.js).'; return; }

/* ---------- renderer / scene / camera ---------- */
var app=document.getElementById('app');
var renderer=new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth, window.innerHeight);
if('outputColorSpace' in renderer) renderer.outputColorSpace=THREE.SRGBColorSpace;
if('ACESFilmicToneMapping' in THREE){ renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.85; }
app.appendChild(renderer.domElement);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0e0b08);
scene.fog=new THREE.FogExp2(0x120c07, 0.012);

var camera=new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.1, 300);
var eyeH=1.7;
camera.position.set(0, eyeH, 0);

/* ---------- dimensions ---------- */
var N=WORKS.length;
var halfW=3.2, ceilH=4.0, spacing=6, firstZ=6;
var roomLen=firstZ + N*spacing + 6;

/* ---------- materials ---------- */
function stdMat(c,r,m){ return new THREE.MeshStandardMaterial({color:c, roughness:(r==null?0.9:r), metalness:(m==null?0:m)}); }
/* rounded box → soft, cartoony edges instead of sharp blocky ones */
var _BG=THREE.BoxGeometry;
function rbox(w,h,d,rr,seg){ var r=(rr==null?Math.min(w,h,d)*0.28:Math.min(rr,Math.min(w,h,d)/2)); seg=seg||4;
  var g=new _BG(w,h,d,seg,seg,seg), p=g.attributes.position, hw=w/2-r, hh=h/2-r, hd=d/2-r;
  for(var i=0;i<p.count;i++){ var x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    var cx=Math.max(-hw,Math.min(hw,x)),cy=Math.max(-hh,Math.min(hh,y)),cz=Math.max(-hd,Math.min(hd,z));
    var dx=x-cx,dy=y-cy,dz=z-cz,l=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(l>1e-6){ var s=r/l; p.setXYZ(i,cx+dx*s,cy+dy*s,cz+dz*s); } }
  p.needsUpdate=true; g.computeVertexNormals(); return g; }
var wallL=stdMat(0x3a302a,0.96), wallR=stdMat(0x322922,0.96), endMat=stdMat(0x2c2620,0.98);
var floorMat=stdMat(0x1c1713,0.55,0.2), ceilMat=stdMat(0x241e19,1);
var woodMat=stdMat(0x4a3423,0.7), woodDark=stdMat(0x38271a,0.75);
var skirtMat=stdMat(0x14100d,0.9);
var metalMat=new THREE.MeshStandardMaterial({color:0x17130f, roughness:0.5, metalness:0.6});

/* ---------- corridor shell ---------- */
function plane(w,h,mat){ return new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat); }
var midZ=-roomLen/2;
var floor=plane(halfW*2, roomLen+20, floorMat); floor.rotation.x=-Math.PI/2; floor.position.set(0,0,midZ); scene.add(floor);
var ceil=plane(halfW*2, roomLen+20, ceilMat); ceil.rotation.x=Math.PI/2; ceil.position.set(0,ceilH,midZ); scene.add(ceil);
var lw=plane(roomLen+20, ceilH, wallL); lw.rotation.y=Math.PI/2; lw.position.set(-halfW, ceilH/2, midZ); scene.add(lw);
var rw=plane(roomLen+20, ceilH, wallR); rw.rotation.y=-Math.PI/2; rw.position.set(halfW, ceilH/2, midZ); scene.add(rw);
var ew=plane(halfW*2, ceilH, endMat); ew.position.set(0, ceilH/2, -roomLen+0.4); scene.add(ew);
/* skirting boards */
[-1,1].forEach(function(s){ var sk=new THREE.Mesh(rbox(0.08,0.22,roomLen+20), skirtMat); sk.position.set(s*(halfW-0.04),0.11,midZ); scene.add(sk); });

/* --- sophisticated lofi wall treatment: plaster grain + wainscot panelling + mouldings --- */
(function(){
  function grainTex(){ var c=document.createElement('canvas'); c.width=c.height=256; var x=c.getContext('2d'); x.fillStyle='#e6e6e6'; x.fillRect(0,0,256,256);
    for(var i=0;i<8000;i++){ var v=200+((Math.random()*55)|0), a=(0.06+Math.random()*0.12).toFixed(2); x.fillStyle='rgba('+v+','+v+','+v+','+a+')'; x.fillRect((Math.random()*256)|0,(Math.random()*256)|0,1,1); }
    for(var j=0;j<44;j++){ x.fillStyle='rgba(110,98,86,'+(0.03+Math.random()*0.045).toFixed(3)+')'; var r=8+Math.random()*22; x.beginPath(); x.arc(Math.random()*256,Math.random()*256,r,0,7); x.fill(); }
    var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; if('colorSpace'in t)t.colorSpace=THREE.SRGBColorSpace; return t; }
  var g1=grainTex(), g2=grainTex();
  g1.repeat.set((roomLen+20)/3, ceilH/2.6); g2.repeat.set((roomLen+20)/3, ceilH/2.6);
  wallL.map=g1; wallR.map=g2; wallL.roughness=1; wallR.roughness=1; wallL.needsUpdate=true; wallR.needsUpdate=true;

  var wainMat=stdMat(0x2c241d,0.85), railMat=stdMat(0x463525,0.55), grooveMat=stdMat(0x18130f,0.9);
  var len=roomLen+20, wainTop=1.0, railY=1.04, crownY=ceilH-0.07;
  function dressWall(side){
    var wain=new THREE.Mesh(rbox(0.05,(wainTop-0.2),len), wainMat); wain.position.set(side*(halfW-0.025),(0.2+wainTop)/2,midZ); scene.add(wain);
    var rail=new THREE.Mesh(rbox(0.08,0.075,len), railMat); rail.position.set(side*(halfW-0.04),railY,midZ); scene.add(rail);
    var crown=new THREE.Mesh(rbox(0.1,0.1,len), railMat); crown.position.set(side*(halfW-0.05),crownY,midZ); scene.add(crown);
    for(var gz=-2; gz>-roomLen+2; gz-=2.2){ var gr=new THREE.Mesh(rbox(0.02,(wainTop-0.3),0.035), grooveMat); gr.position.set(side*(halfW-0.052),(0.3+wainTop)/2,gz); scene.add(gr); }
  }
  dressWall(-1); dressWall(1);
})();
/* ceiling lighting track rail down the centre */
var track=new THREE.Mesh(rbox(0.09,0.06,roomLen), metalMat); track.position.set(0, ceilH-0.03, midZ); scene.add(track);

/* ---------- lighting (few lights + emissive; kept cheap) ---------- */
scene.add(new THREE.HemisphereLight(0x7a5c38, 0x140d07, 2.25));
scene.add(new THREE.AmbientLight(0x5a4430, 1.5));
var keyL=new THREE.DirectionalLight(0xffe0b0, 0.6); keyL.position.set(3,6,2); scene.add(keyL);
var endGlow=new THREE.PointLight(0xffb266, 26, 16, 2); endGlow.position.set(0, 2.2, -roomLen+2.2); scene.add(endGlow);

/* ---------- glow sprite (warm light pool, no real light) ---------- */
function radialTex(){ var c=document.createElement('canvas'); c.width=c.height=128; var x=c.getContext('2d');
  var g=x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
var glowTex=radialTex();
function glow(x,y,z,ry,scale,color,op){ var m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({map:glowTex,color:color,transparent:true,opacity:(op==null?1:op),blending:THREE.AdditiveBlending,depthWrite:false}));
  m.position.set(x,y,z); m.rotation.y=ry; m.scale.set(scale,scale,scale); scene.add(m); return m; }
function glowFloor(x,z,scale,color,op){ var m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({map:glowTex,color:color,transparent:true,opacity:(op==null?1:op),blending:THREE.AdditiveBlending,depthWrite:false}));
  m.position.set(x,0.02,z); m.rotation.x=-Math.PI/2; m.scale.set(scale,scale,scale); scene.add(m); return m; }
/* a track-mounted spotlight can, tilted toward the artwork on 'side'; lights the wall on lit bays */
function makeSpot(z, side, lit){
  var g=new THREE.Group(); g.position.set(0, ceilH-0.03, z); scene.add(g);
  var stem=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.12,8), metalMat); stem.position.y=-0.07; g.add(stem);
  var head=new THREE.Group(); head.position.y=-0.14; head.rotation.z=side*0.55; g.add(head);
  head.add(new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.078,0.17,16), metalMat));
  var lens=new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.052,0.02,16), new THREE.MeshBasicMaterial({color:0xffe6b0})); lens.position.y=-0.09; head.add(lens);
  glow(side*0.16, ceilH-0.28, z, 0, 0.42, 0xffd0a0, 0.55);
  if(lit){ var cl=new THREE.PointLight(0xffc890, 6.5, 10, 2); cl.position.set(side*0.25, ceilH-0.45, z); scene.add(cl); }
  return g;
}
/* a hanging Edison-style pendant bulb */
function makePendant(z){
  var g=new THREE.Group(); g.position.set(0, ceilH-0.03, z); scene.add(g);
  var cord=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.55,6), new THREE.MeshStandardMaterial({color:0x0d0b09})); cord.position.y=-0.30; g.add(cord);
  var bulb=new THREE.Mesh(new THREE.SphereGeometry(0.065,14,14), new THREE.MeshStandardMaterial({color:0xffd98a, emissive:0xffb347, emissiveIntensity:1.4, roughness:0.4})); bulb.position.y=-0.60; g.add(bulb);
  glow(0, ceilH-0.63, z, 0, 0.6, 0xffb85a, 0.6);
  var pl=new THREE.PointLight(0xffb266, 4.5, 7, 2); pl.position.y=-0.60; g.add(pl);
  return g;
}

/* ---------- artwork textures (draw to canvas so jpg + svg both work) ---------- */
function placeholderTex(w){ var c=document.createElement('canvas'); c.width=384;c.height=512; var x=c.getContext('2d');
  x.fillStyle='#efe6d3'; x.fillRect(0,0,384,512); x.fillStyle='#8a3a25'; x.fillRect(24,24,336,464);
  x.fillStyle='#efe6d3'; x.font='bold 26px Syne, sans-serif'; x.textAlign='center';
  x.fillText((w.title||'').toUpperCase().slice(0,16), 192, 270);
  var t=new THREE.CanvasTexture(c); if('colorSpace' in t) t.colorSpace=THREE.SRGBColorSpace; return t; }
function loadArt(w, cb){
  if(!w.image){ cb(placeholderTex(w), 0.75); return; }
  var img=new Image();
  img.onload=function(){ var c=document.createElement('canvas'); var maxd=800, s=Math.min(1, maxd/Math.max(img.width,img.height));
    c.width=Math.max(2,Math.round(img.width*s)); c.height=Math.max(2,Math.round(img.height*s));
    try{ c.getContext('2d').drawImage(img,0,0,c.width,c.height); }catch(e){ cb(placeholderTex(w),0.75); return; }
    var t=new THREE.CanvasTexture(c); if('colorSpace' in t) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
    cb(t, img.width/img.height); };
  img.onerror=function(){ cb(placeholderTex(w),0.75); };
  img.src=w.image;
}

/* ---------- frames on the walls ---------- */
var picks=[];        // clickable art meshes
var artData=[];      // {z, i} for the "now viewing" indicator
var artW=1.8, artH=2.4;
WORKS.forEach(function(w,i){
  var side=(i%2===0)?-1:1;
  var z=-(firstZ + i*spacing);
  var x=side*(halfW-0.09);
  var ry=-side*Math.PI/2;               // face toward the centre of the corridor
  var g=new THREE.Group(); g.position.set(x,1.95,z); g.rotation.y=ry; scene.add(g);
  var frame=new THREE.Mesh(rbox(artW+0.3, artH+0.3, 0.13), woodDark); g.add(frame);
  var mat=new THREE.Mesh(new THREE.PlaneGeometry(artW+0.14, artH+0.14), stdMat(0xefe6d3,1)); mat.position.z=0.07; g.add(mat);
  var artMat=new THREE.MeshStandardMaterial({color:0x000000, emissive:0xffffff, emissiveIntensity:1.7, roughness:1});
  var art=new THREE.Mesh(new THREE.PlaneGeometry(artW, artH), artMat); art.position.z=0.075; art.userData.i=i; g.add(art); picks.push(art);
  loadArt(w, function(tex, aspect){
    var planeA=artW/artH;
    if(aspect>planeA){ tex.repeat.x=planeA/aspect; tex.offset.x=(1-tex.repeat.x)/2; }
    else{ tex.repeat.y=aspect/planeA; tex.offset.y=(1-tex.repeat.y)/2; }
    artMat.map=tex; artMat.emissiveMap=tex; artMat.color.setHex(0xffffff); artMat.emissive.setHex(0xffffff); artMat.needsUpdate=true;
  });
  /* warm pool of light spilling onto the wall behind the piece + the floor in front */
  glow(x - side*0.02, 2.0, z, ry, 5.0, 0xffb060, 0.85);
  glowFloor(x*0.5, z, 3.2, 0xffb060, 0.32);
  /* track spotlight fixture aimed at this piece (real light on every 4th) */
  makeSpot(z, side, (i%4===0));
  artData.push({z:z, i:i});
});

/* ---------- featured piece at the far end ---------- */
(function(){ var np=(SITE.name||'JACK').split(' ');
  var c=document.createElement('canvas'); c.width=420;c.height=420; var x=c.getContext('2d');
  x.fillStyle='#efe6d3'; x.fillRect(0,0,420,420);
  x.fillStyle='#2a2119'; x.textAlign='center'; x.font='800 66px Syne, sans-serif'; x.fillText((np[0]||'').toUpperCase(),210,190);
  x.font='800 40px Syne, sans-serif'; x.fillText((np[1]||'').toUpperCase(),210,245);
  x.fillStyle='#8a3a25'; x.font='700 22px "Noto Sans JP", sans-serif'; x.fillText('つづく — more soon',210,300);
  var t=new THREE.CanvasTexture(c); if('colorSpace' in t) t.colorSpace=THREE.SRGBColorSpace;
  var fg=new THREE.Group(); fg.position.set(0,2.0,-roomLen+0.55); scene.add(fg);
  fg.add(new THREE.Mesh(rbox(2.5,2.5,0.14), woodDark));
  var sign=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.2), new THREE.MeshStandardMaterial({map:t, emissive:0xffffff, emissiveMap:t, emissiveIntensity:0.7, roughness:1}));
  sign.position.z=0.08; fg.add(sign);
  glow(0, 2.0, -roomLen+0.7, 0, 6, 0xffb060, 0.6);
})();

/* ---------- rug runner down the centre (chill muted flatweave, seamless tiling) ---------- */
(function(){ var c=document.createElement('canvas'); c.width=256;c.height=256; var x=c.getContext('2d');

  yaw += (-px*0.5 - yaw)*0.08; pit += (-py*0.16 - pit)*0.08;
  camera.position.set(px*0.7, eyeH, camZ);
  camera.rotation.set(pit, yaw, 0, 'YXZ');
  if(FIRELIGHTS.length){ _fireT+=0.05; for(var fi=0;fi<FIRELIGHTS.length;fi++){ var f=FIRELIGHTS[fi]; f.l.intensity=f.b*(0.82+0.18*Math.sin(_fireT*3.1+fi)+0.1*Math.sin(_fireT*11.7+fi*2.3)); } }
  renderer.render(scene, camera);
  var n=nearest(); chapind.textContent='第'+(n+1)+'話 「'+WORKS[n].title+'」';
}
animate();

/* fade out loader once a frame has drawn */
setTimeout(function(){ var l=document.getElementById('loading'); l.style.opacity='0'; setTimeout(function(){ l.style.display='none'; }, 600); }, 400);
})();
</script>
<script src="rough.js"></script>
<script>
(function(){
  if(typeof rough==='undefined') return;
  var NS='http://www.w3.org/2000/svg', t;
  function draw(){
    Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){
      var old=b.querySelector('.sketch'); if(old) old.remove();
      var r=b.getBoundingClientRect(), w=Math.round(r.width), h=Math.round(r.height); if(!w||!h) return;
      var svg=document.createElementNS(NS,'svg'); svg.setAttribute('class','sketch'); svg.setAttribute('viewBox','0 0 '+w+' '+h); svg.setAttribute('preserveAspectRatio','none');
      var rc=rough.svg(svg);
      svg.appendChild(rc.rectangle(3,3,w-6,h-6,{roughness:2,bowing:2.4,stroke:'#cdb994',strokeWidth:1.7,fill:'none'}));
      b.insertBefore(svg,b.firstChild);
    });
  }
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(draw); setTimeout(draw,450); } else { setTimeout(draw,300); }
  window.addEventListener('resize',function(){ clearTimeout(t); t=setTimeout(draw,150); });
})();
</script>
