<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack Griffin — Illustration</title>
<meta name="description" content="Portfolio of Jack Griffin — illustration and drawing. Walk the corridor.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23D6362B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111;
  --paper:#F7F4EC;
  --paper2:#F0EDE2;
  --red:#D6362B;
  --amber:#E4B04A;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--ink);font-family:'Syne',sans-serif;overflow:hidden;}
#scene{position:fixed;inset:0;perspective:620px;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;}
#hall{position:absolute;left:50%;top:50%;transform-style:preserve-3d;}
.wall,#floor,#ceil,#endwall,#titleplane{position:absolute;}
#speedlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:4;object-fit:cover;mix-blend-mode:multiply;will-change:opacity;}
/* gallery after-hours: depth haze at the vanishing point + a soft vignette (static, no runtime cost) */
#atmos{position:fixed;inset:0;z-index:8;pointer-events:none;
  background:
    radial-gradient(38% 30% at 50% 45%, rgba(255,176,96,0.22), rgba(255,176,96,0) 72%),
    radial-gradient(130% 120% at 50% 50%, rgba(18,10,4,0) 38%, rgba(18,10,4,0.40) 80%, rgba(18,10,4,0.72) 100%);}
.hdr{position:fixed;z-index:20;color:var(--paper);}
#logo{top:22px;left:28px;font-weight:800;font-size:18px;letter-spacing:1px;cursor:pointer;}
#logo span{color:var(--red);}
#nav{top:20px;right:24px;display:flex;gap:10px;}
#nav button{background:transparent;border:2px solid var(--paper);color:var(--paper);font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;padding:8px 16px;cursor:pointer;border-radius:0;}
#nav button:hover{background:var(--red);border-color:var(--red);}
#chapind{bottom:16px;left:28px;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:13px;color:#B8B4A8;}
#hint{bottom:16px;right:28px;font-size:11px;letter-spacing:2px;color:#B8B4A8;text-align:right;}
#pbwrap{position:fixed;left:0;right:0;bottom:0;height:4px;z-index:21;}
#pb{height:100%;width:0%;background:var(--red);}
.panel{position:absolute;background:#efe6d3;padding:9px;border:7px solid #6b4a2f;border-radius:2px;box-shadow:0 16px 34px rgba(0,0,0,.6),0 0 55px 8px rgba(255,186,112,.20);cursor:pointer;transition:box-shadow .3s,opacity .3s;}
.panel:hover{box-shadow:0 16px 34px rgba(0,0,0,.6),0 0 80px 16px rgba(255,196,120,.45);}
.panel img{display:block;width:100%;height:250px;object-fit:cover;}
.panel svg{display:block;width:100%;}
.panel .cap{background:var(--ink);color:var(--paper);font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;text-align:center;padding:6px 4px;}
.panel:hover .cap{color:var(--amber);}
.sfx{position:absolute;writing-mode:vertical-rl;font-family:'Noto Sans JP',sans-serif;font-weight:900;transition:opacity .3s;pointer-events:none;}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(17,17,17,.72);z-index:50;padding:20px;}
.overlay.open{display:flex;}
.sheet{background:#FFF;border:6px solid var(--ink);box-shadow:16px 16px 0 var(--ink);max-width:940px;width:100%;max-height:92vh;overflow:auto;display:flex;}
.sheet .artbox{flex:1.2;min-width:0;background:var(--paper2);border-right:6px solid var(--ink);display:flex;align-items:center;justify-content:center;padding:0;}
.sheet .artbox img{width:100%;height:100%;object-fit:cover;display:block;}
.sheet .artbox svg{width:100%;display:block;}
.sheet .info{flex:1;padding:30px 32px;min-width:0;}
.chapno{font-family:'Noto Sans JP',sans-serif;font-weight:900;font-size:16px;color:var(--red);}
.sheet h1{font-weight:800;font-size:30px;margin:8px 0 6px;color:var(--ink);line-height:1.1;}
.meta{font-size:12px;letter-spacing:2px;color:#6B675C;margin-bottom:16px;}
.desc{font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:1.8;color:#333;}
.btnrow{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}
.btnrow button{background:#FFF;border:3px solid var(--ink);color:var(--ink);font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;padding:10px 16px;cursor:pointer;}
.btnrow button:hover:not(:disabled){background:var(--red);border-color:var(--red);color:#FFF;}
.btnrow button:disabled{opacity:.3;cursor:default;}
#grid{position:fixed;inset:0;background:var(--paper);z-index:40;display:none;overflow:auto;}
#grid.open{display:block;}
#grid .ghead{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;position:sticky;top:0;background:var(--paper);border-bottom:4px solid var(--ink);z-index:2;}
#grid .ghead .t{font-weight:800;font-size:20px;color:var(--ink);}
#grid .ghead .t em{font-family:'Noto Sans JP',sans-serif;font-style:normal;font-weight:900;color:var(--red);margin-left:10px;font-size:15px;}
#grid .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px;padding:32px;}
#grid .panel{position:static;}
.xbtn{background:var(--ink);border:3px solid var(--ink);color:var(--paper);font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;padding:10px 18px;cursor:pointer;}
.xbtn:hover{background:var(--red);border-color:var(--red);}
#backbtn{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:22;display:none;background:var(--ink);border:3px solid var(--paper);color:var(--paper);font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;padding:12px 22px;cursor:pointer;}
#backbtn:hover{background:var(--red);border-color:var(--red);}
@media (max-width:760px){
  .sheet{flex-direction:column;}
  .sheet .artbox{border-right:none;border-bottom:6px solid var(--ink);}
  #hint{display:none;}
  #logo{font-size:15px;}
}
</style>
</head>
<body>
<div id="scene" aria-label="3D gallery corridor. Use the grid button for a standard view of all work.">
  <div id="hall">
    <div class="wall" id="wl"></div>
    <div class="wall" id="wr"></div>
    <div id="floor"></div>
    <div id="ceil"></div>
    <div id="endwall"></div>
    <div id="titleplane"></div>
  </div>
  <video id="speedlines" src="art/speedlines.mp4" muted loop playsinline preload="auto" aria-hidden="true"></video>
</div>
<div id="atmos" aria-hidden="true"></div>
<div class="hdr" id="logo" role="button" tabindex="0" aria-label="back to start"></div>
<div class="hdr" id="nav">
  <button id="btnhome" aria-label="back to home page">⌂ HOME</button>
  <button id="btnsfx" aria-label="toggle sound effects" aria-pressed="false">SFX ✕</button>
  <button id="btngrid" aria-label="view all work as a grid">GRID</button>
  <button id="btnabout" aria-label="about">ABOUT</button>
</div>
<div class="hdr" id="chapind"></div>
<div class="hdr" id="hint"></div>
<div id="pbwrap"><div id="pb"></div></div>
<button id="backbtn" aria-label="return to walking the corridor">&#8617; BACK TO THE CORRIDOR</button>

<div id="grid">
  <div class="ghead">
    <div class="t">ALL WORK <em id="gjp"></em></div>
    <button class="xbtn" id="gclose">ENTER CORRIDOR &darr;</button>
  </div>
  <div class="cards" id="gcards"></div>
</div>

<div class="overlay" id="chap" role="dialog" aria-modal="true"><div class="sheet" id="chapsheet"></div></div>
<div class="overlay" id="about" role="dialog" aria-modal="true"><div class="sheet" id="aboutsheet"></div></div>

<script src="works-school.js"></script>
<script src="works-personal.js"></script>
<script src="works-sketchbook.js"></script>
<script src="works-projects.js"></script>
<script src="works.js"></script>
<script>
(function(){
"use strict";
var INK='#111111', PAPER='#F7F4EC', RED='#D6362B', AMBER='#E4B04A';
/* warm "after-hours gallery" palette */
var WALL_L='#3a302a', WALL_R='#312822', FLOORC='#1f1a16', CEILC='#26201b', SEAM='#171310', SKIRT='#14100d';
var HW=260, HH=190, SPACING=420, FIRST=480;
var N=WORKS.length;
var L=FIRST + N*SPACING + 320;
var CAMMIN=40, CAMMAX=L-300;

document.title = SITE.name + " — Illustration";
document.getElementById('logo').innerHTML = SITE.name.split(' ')[0].toUpperCase() + '<span>.</span>';
document.getElementById('gjp').textContent = SITE.jpName;

/* ---------- manga placeholder drawings (used when a work has no image yet) ---------- */
function ph(i){
  var u='u'+i;
  var defs='<defs><pattern id="'+u+'" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.4" fill="'+INK+'"/></pattern></defs>';
  var arts=[
  '<svg viewBox="0 0 230 250" preserveAspectRatio="xMidYMid slice">'+defs+'<rect width="230" height="250" fill="#FFF"/><rect width="230" height="100" fill="url(#'+u+')"/><path d="M48 110 L62 48 L82 84 L100 28 L122 74 L145 24 L163 78 L192 44 L196 110 Q196 126 182 122 L62 122 Q48 126 48 110 Z" fill="'+INK+'"/><path d="M60 116 Q56 202 120 208 Q184 202 180 116" fill="#FFF" stroke="'+INK+'" stroke-width="4"/><ellipse cx="92" cy="152" rx="11" ry="17" fill="'+INK+'"/><ellipse cx="148" cy="152" rx="11" ry="17" fill="'+INK+'"/><circle cx="96" cy="146" r="4" fill="#FFF"/><circle cx="152" cy="146" r="4" fill="#FFF"/><path d="M106 188 q14 10 28 0" stroke="'+INK+'" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="58" y="222" width="124" height="28" fill="'+RED+'"/></svg>',
  '<svg viewBox="0 0 230 250" preserveAspectRatio="xMidYMid slice">'+defs+'<rect width="230" height="250" fill="#FFF"/><g stroke="'+INK+'" stroke-linecap="round"><line x1="10" y1="44" x2="158" y2="44" stroke-width="3"/><line x1="10" y1="70" x2="132" y2="70" stroke-width="5"/><line x1="10" y1="96" x2="148" y2="96" stroke-width="2"/><line x1="10" y1="198" x2="115" y2="198" stroke-width="4"/><line x1="10" y1="222" x2="138" y2="222" stroke-width="2"/></g><g transform="rotate(38 150 132)"><rect x="126" y="50" width="44" height="136" fill="'+AMBER+'" stroke="'+INK+'" stroke-width="4"/><path d="M126 186 L148 228 L170 186 Z" fill="#F7E8C8" stroke="'+INK+'" stroke-width="4"/><path d="M141 214 L148 228 L155 214 Z" fill="'+INK+'"/><rect x="126" y="34" width="44" height="16" fill="'+RED+'" stroke="'+INK+'" stroke-width="4"/></g><text x="24" y="162" font-family="Noto Sans JP, sans-serif" font-weight="900" font-size="42" fill="'+RED+'">シャッ!</text></svg>',
  '<svg viewBox="0 0 230 250" preserveAspectRatio="xMidYMid slice">'+defs+'<rect width="230" height="250" fill="#FFF"/><rect width="230" height="74" fill="url(#'+u+')"/><path d="M22 152 Q115 72 208 152 Q115 212 22 152 Z" fill="#FFF" stroke="'+INK+'" stroke-width="6"/><circle cx="115" cy="146" r="40" fill="'+INK+'"/><circle cx="101" cy="131" r="12" fill="#FFF"/><circle cx="131" cy="161" r="6" fill="#FFF"/><path d="M42 126 L22 110 M72 102 L58 82 M158 102 L172 82 M188 126 L208 110" stroke="'+INK+'" stroke-width="4" stroke-linecap="round"/></svg>',
  '<svg viewBox="0 0 230 250" preserveAspectRatio="xMidYMid slice"><rect width="230" height="250" fill="#FFF"/><path d="M50 230 Q40 180 63 160 Q53 136 66 126 L76 140 Q86 135 96 140 L106 126 Q119 136 109 160 Q139 180 125 230 Z" fill="'+INK+'"/><path d="M125 220 Q155 216 145 186" stroke="'+INK+'" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="75" cy="172" r="4" fill="'+AMBER+'"/><circle cx="97" cy="172" r="4" fill="'+AMBER+'"/><ellipse cx="160" cy="76" rx="58" ry="40" fill="#FFF" stroke="'+INK+'" stroke-width="4"/><path d="M130 110 L114 136 L150 114" fill="#FFF" stroke="'+INK+'" stroke-width="4"/><text x="160" y="88" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-weight="900" font-size="30" fill="'+RED+'">ニャー</text></svg>',
  '<svg viewBox="0 0 230 250" preserveAspectRatio="xMidYMid slice">'+defs+'<rect width="230" height="250" fill="#FFF"/><rect width="230" height="120" fill="url(#'+u+')"/><circle cx="115" cy="98" r="52" fill="'+RED+'"/><path d="M-8 190 Q60 140 115 186 T240 178 V252 H-8 Z" fill="#FFF" stroke="'+INK+'" stroke-width="5"/><path d="M-8 222 Q80 190 150 222 T240 216 V252 H-8 Z" fill="'+INK+'"/></svg>',
  '<svg viewBox="0 0 230 250" preserveAspectRatio="xMidYMid slice"><rect width="230" height="250" fill="#FFF"/><g fill="none" stroke-linecap="round"><path d="M78 232 C72 168 50 142 42 82" stroke="'+INK+'" stroke-width="5"/><path d="M150 232 C155 160 143 124 150 62" stroke="'+INK+'" stroke-width="5"/></g><ellipse cx="42" cy="72" rx="18" ry="32" fill="none" stroke="'+INK+'" stroke-width="4" transform="rotate(-14 42 72)"/><ellipse cx="150" cy="52" rx="17" ry="30" fill="'+RED+'" transform="rotate(8 150 52)"/><path d="M42 50 L42 94 M150 32 L150 74" stroke="'+INK+'" stroke-width="2.5"/></svg>'];
  return arts[i % arts.length];
}
function artFor(w,i,forPanel){
  if(w.image){ return '<img src="'+w.image+'" alt="'+w.title.replace(/"/g,'&quot;')+'" loading="lazy">'; }
  return ph(i);
}

/* ---------- build the corridor ---------- */
var wl=document.getElementById('wl'), wr=document.getElementById('wr');
var fl=document.getElementById('floor'), ce=document.getElementById('ceil');
[wl,wr].forEach(function(w,ix){
  w.style.cssText+='left:'+(ix===0?-HW:HW)+'px;top:-'+HH+'px;width:'+L+'px;height:'+(2*HH)+'px;background:'+(ix===0?WALL_L:WALL_R)+';transform-origin:left center;transform:rotateY(90deg);';
  var bb=document.createElement('div');
  bb.style.cssText='position:absolute;left:0;bottom:0;width:'+L+'px;height:22px;background:'+SKIRT+';';
  w.appendChild(bb);
});
var kat=document.createElement('div');
kat.style.cssText='position:absolute;left:70px;top:40px;writing-mode:vertical-rl;font-family:\'Noto Sans JP\',sans-serif;font-weight:900;font-size:36px;color:'+INK+';transform:scaleX(-1);letter-spacing:5px;';
kat.textContent=SITE.jpName;
wr.appendChild(kat);
[fl,ce].forEach(function(p,ix){
  p.style.cssText+='left:-'+HW+'px;top:'+(ix===0?HH:-HH)+'px;width:'+(2*HW)+'px;height:'+L+'px;background:'+(ix===0?FLOORC:CEILC)+';transform-origin:center top;transform:rotateX(-90deg);';
});
var rugW=210, rugTop=FIRST-140, rugH=(N-1)*SPACING+460;
var rug=document.createElement('div');
rug.style.cssText='position:absolute;left:'+(HW-rugW/2)+'px;top:'+rugTop+'px;width:'+rugW+'px;height:'+rugH+'px;'+
  'background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 3px,transparent 3px 26px),'+
  'repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 3px,transparent 3px 26px),'+
  'linear-gradient(#7a2f22,#8a3a25);'+
  'border:10px solid #b5824e;box-shadow:inset 0 0 0 6px rgba(0,0,0,.28),inset 0 0 46px rgba(0,0,0,.45);opacity:.94;';
fl.appendChild(rug);
for(var h=260; h<L-260; h+=SPACING){
  [wl,wr].forEach(function(w){
    var g=document.createElement('div');
    g.style.cssText='position:absolute;left:'+h+'px;top:0;width:4px;height:'+(2*HH)+'px;background:'+SEAM+';';
    w.appendChild(g);
  });
  [fl,ce].forEach(function(p){
    var g=document.createElement('div');
    g.style.cssText='position:absolute;left:0;top:'+h+'px;width:'+(2*HW)+'px;height:4px;background:'+SEAM+';';
    p.appendChild(g);
  });
}
/* warm ceiling track-lights running down the centre */
for(var hl=FIRST-60; hl<L-160; hl+=SPACING){
  var bulb=document.createElement('div');
  bulb.style.cssText='position:absolute;left:'+(HW-9)+'px;top:'+hl+'px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffe6bd,#d69236);box-shadow:0 0 26px 10px rgba(255,190,120,.55);';
  ce.appendChild(bulb);
}

var frames=[];
WORKS.forEach(function(w,i){
  var d=FIRST + i*SPACING;
  var side=(i%2===0)?-1:1;
  var el=document.createElement('figure');
  el.className='panel';
  el.style.cssText='margin:0;left:-115px;top:-150px;width:230px;transition:opacity .3s;transform:translate3d('+(side*(HW-1))+'px,0,'+(-d)+'px) rotateY('+(side===-1?90:-90)+'deg);';
  el.innerHTML=artFor(w,i,true)+'<figcaption class="cap">第'+(i+1)+'話 — '+w.title.toUpperCase()+'</figcaption>';
  el.addEventListener('click',function(){ if(!moved) openChapter(i); });
  document.getElementById('hall').appendChild(el);
  frames.push({el:el,d:d,side:side});
});

var ew=document.getElementById('endwall');
ew.style.cssText+='left:-'+HW+'px;top:-'+HH+'px;width:'+(2*HW)+'px;height:'+(2*HH)+'px;background:'+WALL_R+';transform:translateZ(-'+L+'px);display:flex;align-items:center;justify-content:center;cursor:pointer;';
var np=SITE.name.split(' ');
ew.innerHTML='<div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 34px;background:#efe6d3;border:9px solid #6b4a2f;box-shadow:0 0 90px 34px rgba(255,180,100,.4),0 14px 34px rgba(0,0,0,.6);"><div style="font-weight:800;font-size:42px;line-height:1;color:#3a302a;">'+np[0].toUpperCase()+'</div><div style="font-weight:800;font-size:26px;line-height:1.3;color:#3a302a;">'+(np[1]||'').toUpperCase()+'</div><div style="font-family:\'Noto Sans JP\',sans-serif;font-weight:700;font-size:15px;color:#8a3a25;margin-top:9px;">つづく — more soon</div></div>';
ew.addEventListener('click',function(){ if(!moved) openAbout(); });

var tp=document.getElementById('titleplane');
tp.style.cssText+='left:-'+HW+'px;top:-'+HH+'px;width:'+(2*HW)+'px;height:'+(2*HH)+'px;transform:translateZ(-320px);display:flex;align-items:center;justify-content:center;transition:opacity .5s;pointer-events:none;';
var pts=[];
for(var b=0;b<28;b++){var a=b/28*Math.PI*2;var f=b%2?1:.8;pts.push((225+Math.cos(a)*215*f).toFixed(1)+','+(140+Math.sin(a)*125*f).toFixed(1));}
tp.innerHTML='<svg width="450" height="280" viewBox="0 0 450 280"><polygon points="'+pts.join(' ')+'" fill="#FFFFFF" stroke="'+INK+'" stroke-width="5"/><text x="225" y="130" text-anchor="middle" font-family="Syne, sans-serif" font-weight="800" font-size="50" fill="'+INK+'">GALLERY</text><text x="225" y="172" text-anchor="middle" font-family="Noto Sans JP, sans-serif" font-weight="700" font-size="22" fill="'+RED+'">ようこそ！</text></svg>';

var sfxDefs=[{d:Math.round(L*.36),txt:'ゴゴゴ',style:'left:-'+(HW-26)+'px;top:-140px;color:transparent;-webkit-text-stroke:3px '+INK+';font-size:76px;transform:translateZ(-'+Math.round(L*.36)+'px) rotate(-5deg);'},
             {d:Math.round(L*.7),txt:'ドドド',style:'left:'+(HW-120)+'px;top:-130px;color:'+RED+';font-size:66px;transform:translateZ(-'+Math.round(L*.7)+'px) rotate(4deg);'}];
var sfx=sfxDefs.map(function(s){
  var el=document.createElement('div');
  el.className='sfx';
  el.style.cssText+=s.style;
  el.textContent=s.txt;
  document.getElementById('hall').appendChild(el);
  return {el:el,d:s.d};
});

/* ---------- speed lines (comic-burst video; white background keyed out via mix-blend-mode:multiply) ---------- */
var spd=document.getElementById('speedlines');
spd.style.display='none';   /* stays fully stopped (no decode / no blend) until you move */

/* ---------- camera ---------- */
var scene=document.getElementById('scene'), hall=document.getElementById('hall');
var pb=document.getElementById('pb'), chapind=document.getElementById('chapind');
var cam=CAMMIN, camT=cam, pcam=cam, auto=false, dragging=false, lastY=0, startY=0, px=0, moved=false, yaw=0, cx=0;
var zoom=0, zoomT=0, facing=false, mode='walk', lockF=null, lockS=1, cy=0, cyT=0, py=0;
var reduced=(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)||false;
var touch=('ontouchstart' in window);
var HINT_WALK=touch?'SWIPE &uarr; TO WALK · TAP A PANEL':'SCROLL &uarr; TO WALK · MOUSE LEFT / RIGHT TO LOOK · CLICK A PANEL';
var HINT_FACE='MOVE MOUSE TO PAN · SCROLL TO ZOOM · CLICK THE ART TO OPEN · ESC TO WALK ON';
document.getElementById('hint').innerHTML=HINT_WALK;
if(!reduced){ setTimeout(function(){auto=true;},900); }

function overlayOpen(){ return !!document.querySelector('.overlay.open'); }

/* ---------- sound effects: synthesised in-browser (no audio files), off by default ---------- */
var AC=null, master=null, sfxOn=false, stepAcc=0, lastStepT=0;
try{ sfxOn=(localStorage.getItem('sfx')==='1'); }catch(e){}
function audioReady(){
  if(!AC){
    var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return false;
    try{ AC=new Ctx(); }catch(e){ return false; }
    master=AC.createGain(); master.gain.value=0.7; master.connect(AC.destination);
  }
  if(AC.state==='suspended'){ try{AC.resume();}catch(e){} }
  return true;
}
function nBuf(dur,sq){
  var n=Math.max(1,Math.floor(AC.sampleRate*dur)), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0), i;
  for(i=0;i<n;i++){ var e=1-i/n; d[i]=(Math.random()*2-1)*(sq?e*e:e); }
  return b;
}
function env(peak,t,a,rel){
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+rel);
  return g;
}
function playStep(){
  if(!sfxOn||!audioReady()) return;
  var t=AC.currentTime; if(t-lastStepT<0.13) return; lastStepT=t;
  var s=AC.createBufferSource(); s.buffer=nBuf(0.09,true); s.playbackRate.value=0.85+Math.random()*0.3;
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=330;
  var g=env(0.09,t,0.005,0.08); s.connect(lp); lp.connect(g); g.connect(master); s.start(t); s.stop(t+0.12);
  var o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(115,t); o.frequency.exponentialRampToValueAtTime(58,t+0.09);
  var g2=env(0.08,t,0.004,0.09); o.connect(g2); g2.connect(master); o.start(t); o.stop(t+0.15);
}
function playWhoosh(){
  if(!sfxOn||!audioReady()) return;
  var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=nBuf(0.4,false);
  var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
  bp.frequency.setValueAtTime(520,t); bp.frequency.exponentialRampToValueAtTime(2600,t+0.26);
  var g=env(0.2,t,0.02,0.3); s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+0.42);
}
function playClose(){
  if(!sfxOn||!audioReady()) return;
  var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=nBuf(0.3,false);
  var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
  bp.frequency.setValueAtTime(2200,t); bp.frequency.exponentialRampToValueAtTime(430,t+0.2);
  var g=env(0.14,t,0.01,0.24); s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+0.34);
}
function playChime(){
  if(!sfxOn||!audioReady()) return;
  var t=AC.currentTime, ns=[523.25,783.99];
  ns.forEach(function(f,i){ var o=AC.createOscillator(); o.type='triangle'; o.frequency.value=f;
    var g=env(0.12,t+i*0.085,0.01,0.3); o.connect(g); g.connect(master); o.start(t+i*0.085); o.stop(t+i*0.085+0.4); });
}
function playTick(){
  if(!sfxOn||!audioReady()) return;
  var t=AC.currentTime;
  var o=AC.createOscillator(); o.type='square'; o.frequency.value=540;
  var g=env(0.045,t,0.002,0.045); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06);
}
function setSfx(on,silent){
  sfxOn=on; try{ localStorage.setItem('sfx',on?'1':'0'); }catch(e){}
  var b=document.getElementById('btnsfx');
  if(b){ b.textContent=on?'SFX ♪':'SFX ✕'; b.setAttribute('aria-pressed',on?'true':'false'); }
  if(on&&!silent){ audioReady(); playTick(); }
}
document.getElementById('btnsfx').addEventListener('click',function(){ setSfx(!sfxOn); });
setSfx(sfxOn,true);
function firstGesture(){ if(sfxOn) audioReady(); window.removeEventListener('pointerdown',firstGesture,true); window.removeEventListener('keydown',firstGesture,true); }
window.addEventListener('pointerdown',firstGesture,true);
window.addEventListener('keydown',firstGesture,true);

scene.addEventListener('pointerdown',function(e){if(overlayOpen())return;dragging=true;auto=false;moved=false;lastY=e.clientY;startY=e.clientY;});
window.addEventListener('pointerup',function(){dragging=false;setTimeout(function(){moved=false;},50);});
window.addEventListener('pointermove',function(e){
  if(overlayOpen())return;
  if(dragging){
    if(!moved && Math.abs(e.clientY-startY)>6) moved=true;
    if(moved && mode==='walk') camT+=(lastY-e.clientY)*2.6;
    lastY=e.clientY;
  }
  px=e.clientX/window.innerWidth-.5;
  py=e.clientY/window.innerHeight-.5;
});
scene.addEventListener('wheel',function(e){
  if(overlayOpen())return;
  e.preventDefault();auto=false;
  if(facing){ zoomT=Math.max(0,Math.min(1,zoomT-e.deltaY*0.0022)); }
  else { camT+=e.deltaY*1.15; }
},{passive:false});
window.addEventListener('keydown',function(e){
  if(document.querySelector('.overlay.open')||document.getElementById('grid').classList.contains('open')) return;
  if(e.key==='ArrowUp'||e.key==='w'){auto=false;camT+=90;}
  if(e.key==='ArrowDown'||e.key==='s'){auto=false;camT-=90;}
});
function loop(){
  if(overlayOpen()){ requestAnimationFrame(loop); return; }
  if(auto){camT+=.6; if(camT>=CAMMAX) auto=false;}
  if(camT<CAMMIN)camT=CAMMIN; if(camT>CAMMAX)camT=CAMMAX;
  var v=cam-pcam; pcam=cam;
  var ax=Math.abs(px), yawTarget=0;
  if(mode==='walk'){
    cam+=(camT-cam)*0.14;
    if(sfxOn){ stepAcc+=Math.abs(v); if(stepAcc>240){ stepAcc=0; playStep(); } }
    if(ax>0.10){ yawTarget=(px>0?1:-1)*Math.min(1,(ax-0.10)/0.22)*55; }
    if(ax>0.32){
      var s=px>0?1:-1, best=null, bd=1e9;
      frames.forEach(function(f){ if(f.side===s){ var dd=Math.abs(f.d-cam); if(dd<bd){bd=dd;best=f;} } });
      if(best&&bd<340){
        mode='view'; lockF=best; lockS=s; auto=false;
        document.getElementById('hint').innerHTML=HINT_FACE;
        document.getElementById('backbtn').style.display='block';
      }
    }
    zoomT=0; cyT=0;
    yaw+=(yawTarget-yaw)*0.07;
  } else {
    yaw+=(lockS*90-yaw)*0.13;
    cam+=((lockF.d-lockS*px*170)-cam)*0.08;
    camT=cam;
    cyT=py*70;
  }
  facing=(mode==='view');
  var th=yaw*Math.PI/180;
  zoom+=(zoomT-zoom)*0.1; cy+=(cyT-cy)*0.1;
  cx=Math.sin(th)*(140+zoom*62);
  hall.style.transform='translateZ(620px) rotateY('+yaw.toFixed(2)+'deg) translate3d('+(-cx).toFixed(1)+'px,'+(-cy).toFixed(1)+'px,'+cam+'px)';
  var av=Math.abs(v), slop=(reduced||av<3.5)?0:Math.min(.85,(av-3.5)/10);
  if(slop>0.01){
    if(spd.style.display==='none') spd.style.display='block';
    if(spd.paused){ var pp=spd.play(); if(pp&&pp.catch) pp.catch(function(){}); }
    spd.style.opacity=slop;
  } else if(spd.style.display!=='none'){
    spd.style.display='none'; spd.style.opacity=0; if(!spd.paused) spd.pause();
  }
  var tpl=document.getElementById('titleplane');
  tpl.style.opacity=cam>210?0:1;
  frames.forEach(function(f){
    var fwd=(f.side*HW-cx)*Math.sin(th)+(f.d-cam)*Math.cos(th);
    var op=fwd>120 ? 1 : fwd<40 ? 0 : (fwd-40)/80;
    f.el.style.opacity=op;
    f.el.style.visibility=op<=0?'hidden':'visible';
  });
  sfx.forEach(function(s){s.el.style.opacity=cam>s.d-80?0:1;});
  pb.style.width=((cam-CAMMIN)/(CAMMAX-CAMMIN)*100)+'%';
  var near=Math.max(0,Math.min(N-1,Math.round((cam+240-FIRST)/SPACING)));
  chapind.textContent='第'+(near+1)+'話 「'+WORKS[near].title+'」';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.getElementById('logo').addEventListener('click',function(){camT=CAMMIN;auto=false;});
document.getElementById('btnhome').addEventListener('click',function(){location.href='index.html';});
function exitView(){
  mode='walk'; lockF=null; zoomT=0; cyT=0;
  document.getElementById('hint').innerHTML=HINT_WALK;
  document.getElementById('backbtn').style.display='none';
}
document.getElementById('backbtn').addEventListener('click',exitView);

/* ---------- chapter overlay ---------- */
var chap=document.getElementById('chap'), sheet=document.getElementById('chapsheet');
function openChapter(i,silent){
  auto=false;
  if(!silent) playWhoosh();
  var w=WORKS[i];
  sheet.innerHTML='<div class="artbox">'+artFor(w,i,false)+'</div>'+
    '<div class="info"><div class="chapno">第'+(i+1)+'話</div><h1>'+w.title+'</h1>'+
    '<div class="meta">'+(w.medium||'').toUpperCase()+(w.date?' · '+w.date:'')+'</div>'+
    '<p class="desc">'+(w.description||'')+'</p>'+
    '<div class="btnrow"><button id="cprev" '+(i===0?'disabled':'')+'>&larr; PREV</button><button id="cnext" '+(i===N-1?'disabled':'')+'>NEXT &rarr;</button><button id="cclose">CLOSE ✕</button></div></div>';
  chap.classList.add('open');
  document.getElementById('cclose').onclick=closeChap;
  document.getElementById('cprev').onclick=function(){playTick();openChapter(i-1,true);};
  document.getElementById('cnext').onclick=function(){playTick();openChapter(i+1,true);};
  chap._idx=i;
}
function closeChap(){ if(chap.classList.contains('open')) playClose(); chap.classList.remove('open');}
chap.addEventListener('click',function(e){if(e.target===chap)closeChap();});

/* ---------- about overlay ---------- */
var about=document.getElementById('about');
function openAbout(){
  auto=false;
  playChime();
  var links='';
  if(SITE.instagram) links+='<a href="'+SITE.instagram+'" style="color:'+RED+';font-weight:700;">Instagram</a> ';
  if(SITE.email) links+='<a href="mailto:'+SITE.email+'" style="color:'+RED+';font-weight:700;">'+SITE.email+'</a>';
  document.getElementById('aboutsheet').innerHTML='<div class="info" style="flex:1;"><div class="chapno">'+SITE.jpName+'</div><h1>'+SITE.name+'</h1>'+
    '<div class="meta">'+SITE.tagline.toUpperCase()+'</div>'+
    '<p class="desc">'+SITE.about+'</p>'+
    (links?'<p class="desc">'+links+'</p>':'')+
    '<div class="btnrow"><button id="aclose">CLOSE ✕</button></div></div>';
  about.classList.add('open');
  document.getElementById('aclose').onclick=function(){about.classList.remove('open');};
}
about.addEventListener('click',function(e){if(e.target===about)about.classList.remove('open');});
document.getElementById('btnabout').addEventListener('click',openAbout);

/* ---------- grid view ---------- */
var grid=document.getElementById('grid'), gcards=document.getElementById('gcards');
WORKS.forEach(function(w,i){
  var c=document.createElement('figure');
  c.className='panel'; c.style.margin='0';
  c.innerHTML=artFor(w,i,true)+'<figcaption class="cap">第'+(i+1)+'話 — '+w.title.toUpperCase()+'</figcaption>';
  c.addEventListener('click',function(){openChapter(i);});
  gcards.appendChild(c);
});
document.getElementById('btngrid').addEventListener('click',function(){playTick();grid.classList.add('open');});
document.getElementById('gclose').addEventListener('click',function(){playTick();grid.classList.remove('open');});

window.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(!document.querySelector('.overlay.open')&&!grid.classList.contains('open')&&mode==='view'){exitView();}
    closeChap();about.classList.remove('open');grid.classList.remove('open');
  }
  if(chap.classList.contains('open')){
    if(e.key==='ArrowLeft'&&chap._idx>0){playTick();openChapter(chap._idx-1,true);}
    if(e.key==='ArrowRight'&&chap._idx<N-1){playTick();openChapter(chap._idx+1,true);}
  }
});

/* small screens & reduced motion: start in the grid */
if(reduced || window.innerWidth<720){ grid.classList.add('open'); }
})();
</script>
</body>
